name: Daily YouTube Video Uploads

on:
  # Allow manual runs from the GitHub UI
  workflow_dispatch:
  
  # Daily scheduled runs
  schedule:
    # Run daily at 2 PM UTC (14:00)
    - cron: '0 14 * * *'

jobs:
  upload-videos:
    name: Upload Videos to YouTube Channels Sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour execution limit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 httplib2 requests

      - name: Create temp directories
        run: |
          mkdir -p temp_download
          mkdir -p tokens_NeuroNews tokens_ByteReport tokens_InfoPulse tokens_EchoAI
      
      # Values are hardcoded in the Python script
      
      - name: Create temporary directories
        run: |
          # Just create the temp directory needed for downloads
          mkdir -p temp_download
          
          # For debugging
          echo "Working directory structure:"
          ls -la
          
      # Upload to each channel sequentially (one after another)
      
      - name: Upload videos to NeuroNews
        id: upload_videos_neuronews
        continue-on-error: true  # Don't fail the whole workflow if one channel fails
        run: |
          echo "Starting uploads for NeuroNews channel"
          
          # Try uploading with multiple attempts if needed
          set +e  # Don't exit on error
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS for NeuroNews"
            python upload_gdrive_videos.py --channel-name "NeuroNews" --limit 3 --privacy-status "unlisted"
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Successfully uploaded to NeuroNews on attempt $attempt"
              break
            elif [ $EXIT_CODE -eq 100 ]; then
              echo "Daily upload limit reached for NeuroNews, continuing with other channels"
              break
            elif [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "Upload attempt failed, waiting before retry..."
              sleep $(( RANDOM % 60 + 30 ))  # Random delay between 30-90 seconds
            fi
          done
          
      - name: Check NeuroNews upload status
        run: |
          if [ "${{ steps.upload_videos_neuronews.outcome }}" == "success" ]; then
            echo "✅ Successfully uploaded videos to NeuroNews"
          else
            echo "❌ Failed to upload videos to NeuroNews"
          fi
      
      # Wait between channel uploads to avoid potential rate limits
      - name: Wait between channel uploads
        run: sleep 60
      
      - name: Upload videos to ByteReport
        id: upload_videos_bytereport
        continue-on-error: true
        run: |
          echo "Starting uploads for ByteReport channel"
          
          # Try uploading with multiple attempts if needed
          set +e  # Don't exit on error
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS for ByteReport"
            python upload_gdrive_videos.py --channel-name "ByteReport" --limit 3 --privacy-status "unlisted"
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Successfully uploaded to ByteReport on attempt $attempt"
              break
            elif [ $EXIT_CODE -eq 100 ]; then
              echo "Daily upload limit reached for ByteReport, continuing with other channels"
              break
            elif [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "Upload attempt failed, waiting before retry..."
              sleep $(( RANDOM % 60 + 30 ))  # Random delay between 30-90 seconds
            fi
          done
          
      - name: Check ByteReport upload status
        run: |
          if [ "${{ steps.upload_videos_bytereport.outcome }}" == "success" ]; then
            echo "✅ Successfully uploaded videos to ByteReport"
          else
            echo "❌ Failed to upload videos to ByteReport"
          fi
      
      # Wait between channel uploads to avoid potential rate limits
      - name: Wait between channel uploads
        run: sleep 60
      
      - name: Upload videos to InfoPulse
        id: upload_videos_infopulse
        continue-on-error: true
        run: |
          echo "Starting uploads for InfoPulse channel"
          
          # Try uploading with multiple attempts if needed
          set +e  # Don't exit on error
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS for InfoPulse"
            python upload_gdrive_videos.py --channel-name "InfoPulse" --limit 3 --privacy-status "unlisted"
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Successfully uploaded to InfoPulse on attempt $attempt"
              break
            elif [ $EXIT_CODE -eq 100 ]; then
              echo "Daily upload limit reached for InfoPulse, continuing with other channels"
              break
            elif [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "Upload attempt failed, waiting before retry..."
              sleep $(( RANDOM % 60 + 30 ))  # Random delay between 30-90 seconds
            fi
          done
          
      - name: Check InfoPulse upload status
        run: |
          if [ "${{ steps.upload_videos_infopulse.outcome }}" == "success" ]; then
            echo "✅ Successfully uploaded videos to InfoPulse"
          else
            echo "❌ Failed to upload videos to InfoPulse"
          fi
      
      # Wait between channel uploads to avoid potential rate limits
      - name: Wait between channel uploads
        run: sleep 60
      
      - name: Upload videos to EchoAI
        id: upload_videos_echoai
        continue-on-error: true
        run: |
          echo "Starting uploads for EchoAI channel"
          
          # Try uploading with multiple attempts if needed
          set +e  # Don't exit on error
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS for EchoAI"
            python upload_gdrive_videos.py --channel-name "EchoAI" --limit 3 --privacy-status "unlisted"
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Successfully uploaded to EchoAI on attempt $attempt"
              break
            elif [ $EXIT_CODE -eq 100 ]; then
              echo "Daily upload limit reached for EchoAI, continuing with other channels"
              break
            elif [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "Upload attempt failed, waiting before retry..."
              sleep $(( RANDOM % 60 + 30 ))  # Random delay between 30-90 seconds
            fi
          done
          
      - name: Check EchoAI upload status
        run: |
          if [ "${{ steps.upload_videos_echoai.outcome }}" == "success" ]; then
            echo "✅ Successfully uploaded videos to EchoAI"
          else
            echo "❌ Failed to upload videos to EchoAI"
          fi
          
      - name: Cleanup
        if: always()  # Run even if previous steps failed
        run: |
          echo "Cleaning up temporary files"
          rm -rf temp_download/*
          
  notification:
    name: Send Summary Notification
    needs: upload-videos
    runs-on: ubuntu-latest
    if: always()  # Run even if uploads job failed
    
    steps:
      - name: Send completion notification
        run: |
          # Get the current date and time in a readable format
          now=$(date)
          
          # Create a detailed completion message
          completion_message="🚀 Daily YouTube Upload Report 📊\n\n"
          completion_message+="✅ Completed at: $now\n"
          completion_message+="✅ Videos: 3 per channel (12 total)\n"
          completion_message+="✅ Channels: Sequentially uploaded to:\n"
          completion_message+="   1. NeuroNews\n"
          completion_message+="   2. ByteReport\n"
          completion_message+="   3. InfoPulse\n"
          completion_message+="   4. EchoAI\n\n"
          completion_message+="Your content is being distributed across all channels sequentially!\n"
          completion_message+="#ContentDelivered #AutomationSuccess"
          
          # Send the notification
          curl -s -X POST "https://api.telegram.org/bot8109148303:AAG1G8iv_uIpz3HpYOZaUknhySXoMYGYlBA/sendMessage" \
            -d chat_id="-1002493560505" \
            -d message_thread_id="777" \
            -d parse_mode="Markdown" \
            -d text="$completion_message"
